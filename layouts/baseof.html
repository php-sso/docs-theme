<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{- partialCached "head.html" . .RelPermalink }}
</head>
<body data-accent="{{ site.Params.accent | default "core" }}">
  <a class="skip" href="#main">Skip to the content</a>
  {{ partial "header.html" . }}
  {{ block "main" . }}{{ end }}
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/docs.js" | resources.Minify | resources.Fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
