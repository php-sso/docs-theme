{{ define "main" }}
<div class="wrap docs">
  {{ partial "sidebar.html" . }}
  <main id="main" class="doc">
    <header class="doc-head">
      <h1>{{ .Title }}</h1>
      {{ with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
    </header>
    <div class="prose">{{ .Content }}</div>
    <ul class="cards">
      {{ range .Pages.ByWeight }}<li><a href="{{ .RelPermalink }}"><h2>{{ .LinkTitle }}</h2><p>{{ .Description | default .Params.lead | default (.Summary | plainify | truncate 140) }}</p></a></li>{{ end }}
    </ul>
  </main>
</div>
{{ end }}
