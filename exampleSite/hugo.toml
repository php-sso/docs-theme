# Example site for the php-sso documentation theme.
# Run it from this folder with:  hugo server
# Copy this file into a repository's docs/ folder and change the parts marked CHANGE.

baseURL = "https://example.org/"          # CHANGE: https://php-sso.github.io/<repository>/
title = "Example docs"                    # CHANGE
locale = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

# The search box reads index.json, which the theme can produce for the home page.
[outputs]
  home = ["html", "json"]

[params]
  description = "An example of the php-sso documentation theme, with every part of it on show."   # CHANGE
  accent = "oidc"                         # CHANGE: core | password | saml | social | scim | oidc
  repo = "https://github.com/php-sso/docs-theme"   # CHANGE
  editPath = "exampleSite"                # CHANGE: the folder that holds content/ inside the repository
  license = "MIT"

  [[params.nav]]
    name = "Guides"
    url = "guides/"

[module]
  # Remove this line in a real repository: it makes the example use the theme from this checkout.
  replacements = "github.com/php-sso/docs-theme -> ../.."
  [[module.imports]]
    path = "github.com/php-sso/docs-theme"
